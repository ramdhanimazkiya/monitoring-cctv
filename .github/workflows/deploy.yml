name: CI/CD Deploy to Production

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS Debian
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            cd /var/www/monitoring-cctv

            CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
            git pull origin "$CURRENT_BRANCH"

            cd backend
            npm install
            npx prisma generate
            npx prisma migrate deploy

            cd ../frontend
            npm install
            npm run build

            cd /var/www/monitoring-cctv
            pm2 reload cctv-backend
